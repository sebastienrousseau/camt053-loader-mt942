# SPDX-License-Identifier: Apache-2.0 OR MIT
# Every restatement of the release version agrees: pyproject, __version__,
# CHANGELOG, releases/, CITATION.cff, the README PyPI renders, SECURITY.md.
# Standard library only; no install.
name: Version sources agree

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/verify_versions.py
