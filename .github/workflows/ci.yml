name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # This package published 0.0.1, 0.0.13, 0.0.14 and 0.0.16 with no
  # releases/ directory at all, because unlike its sibling loaders its
  # release workflow never required one. The notes are backfilled now;
  # this keeps them from falling behind again.
  release-notes:
    name: Release Notes Present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every version must have release notes
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          NOTE_PATH="releases/v${VERSION}.md"
          if [ ! -f "$NOTE_PATH" ]; then
            echo "::error::pyproject.toml declares ${VERSION} but ${NOTE_PATH} does not exist."
            exit 1
          fi
          echo "Found ${NOTE_PATH} for version ${VERSION}"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with 100% coverage gate
        run: |
          pytest tests/ \
            --cov=camt053_loader_mt942 --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml camt053_loader_mt942

      - name: Run examples end-to-end
        run: |
          for example in examples/*.py; do
            echo "--- $example ---"
            python "$example"
          done

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check camt053_loader_mt942/ tests/ examples/

      - name: Ruff format check
        run: ruff format --check camt053_loader_mt942/ tests/ examples/

      - name: Mypy
        run: mypy camt053_loader_mt942/
