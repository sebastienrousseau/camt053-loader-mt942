name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # This package published 0.0.1, 0.0.13, 0.0.14 and 0.0.16 with no
  # releases/ directory at all, because unlike its sibling loaders its
  # release workflow never required one. The notes are backfilled now;
  # this keeps them from falling behind again.
  release-notes:
    name: Release Notes Present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every version must have release notes
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          NOTE_PATH="releases/v${VERSION}.md"
          if [ ! -f "$NOTE_PATH" ]; then
            echo "::error::pyproject.toml declares ${VERSION} but ${NOTE_PATH} does not exist."
            exit 1
          fi
          echo "Found ${NOTE_PATH} for version ${VERSION}"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The runtime dependency and the test toolchain come hash-pinned from
      # requirements/ci.txt; the package itself goes on with --no-deps, so
      # nothing in this job resolves an unpinned version.
      - name: Install this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .

      # The pyproject addopts enforce --cov-branch --cov-fail-under=100, so a
      # coverage regression fails the build here.
      - name: Run tests with 100% coverage gate
        run: pytest tests/ --cov-report=xml

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_parse_mt942.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml camt053_loader_mt942

      - name: Run examples end-to-end
        run: |
          for example in examples/*.py; do
            echo "--- $example ---"
            python "$example"
          done

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .

      - name: Ruff check
        run: ruff check camt053_loader_mt942/ tests/ examples/ benches/ scripts/

      - name: Ruff format check
        run: ruff format --check camt053_loader_mt942/ tests/ examples/ benches/ scripts/

      - name: Mypy
        run: mypy camt053_loader_mt942/

  # Advisory audit of every pinned version CI installs: the runtime
  # dependency and the whole toolchain. --disable-pip audits the pins as
  # written instead of resolving them again.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (hash-pinned)
        run: pip install --require-hashes -r requirements/audit.txt

      - name: Audit the pinned requirements
        run: |
          for req in requirements/ci.txt requirements/build.txt; do
            pip-audit -r "$req" --require-hashes --disable-pip --progress-spinner off
          done
