name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.0.23)"
        required: true

# Least privilege at the top level; the job opts into only what it needs.
permissions:
  contents: read

jobs:
  publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    # Must match the "Environment name" set on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/camt053-loader-mt942
    permissions:
      contents: write       # create the GitHub release and attach the dists
      id-token: write       # OIDC for PyPI trusted publishing + attestations
      attestations: write   # SLSA build provenance
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # build, hatchling and twine come hash-pinned; --no-isolation makes
      # the build use that hatchling rather than fetch an unpinned one.
      - name: Install build tooling (hash-pinned)
        run: pip install --require-hashes -r requirements/build.txt

      - name: Build sdist + wheel
        run: python -m build --no-isolation

      - name: Check with twine
        run: python -m twine check --strict dist/*

      # SLSA build provenance for every distribution file, signed keyless
      # with the workflow's OIDC identity; verify with
      # `gh attestation verify <file> -R sebastienrousseau/camt053-loader-mt942`.
      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Trusted publishing (OIDC): no API token. PEP 740 attestations are
      # uploaded with the files, and skip-existing keeps a re-run safe.
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          skip-existing: true

      # Release titles are "<project> <version>" with no leading v; the tag
      # keeps its v. The notes are replaced by the release handover script
      # with the Highlights / What's Changed / Checksums layout.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "camt053-loader-mt942 ${RELEASE_TAG#v}" --verify-tag \
              --notes-file "releases/${RELEASE_TAG}.md"
          fi
