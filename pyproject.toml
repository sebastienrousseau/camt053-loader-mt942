[project]
name = "camt053-loader-mt942"
version = "0.0.16"
description = "Convert legacy SWIFT MT942 interim transaction reports to camt.052 ParsedDocument."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"
authors = [{ name = "Sebastien Rousseau", email = "sebastian.rousseau@gmail.com" }]
keywords = [
    "iso20022",
    "camt052",
    "camt053",
    "mt942",
    "swift",
    "interim-report",
    "loader",
    "fintech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "camt053 >= 0.0.16, < 1",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8",
    "pytest-cov >= 5",
    "ruff >= 0.6",
    "mypy >= 1.11",
    "interrogate >= 1.7",
]

[project.urls]
Homepage = "https://github.com/sebastienrousseau/camt053-loader-mt942"
Documentation = "https://github.com/sebastienrousseau/camt053-loader-mt942#readme"
Repository = "https://github.com/sebastienrousseau/camt053-loader-mt942"
Issues = "https://github.com/sebastienrousseau/camt053-loader-mt942/issues"
"Parent project" = "https://github.com/sebastienrousseau/camt053"

[build-system]
requires = ["hatchling >= 1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camt053_loader_mt942"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "N", "SIM"]

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-q",
    "--cov=camt053_loader_mt942",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    # Load/stress tests (marker ``perf``) are excluded from the
    # coverage-gated default run, mirroring the camt053 parent
    # project. Select them explicitly with ``-m perf --no-cov``.
    "-m",
    "not perf",
]
markers = [
    "perf: performance / load / stress tests (run with -m perf --no-cov)",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["camt053_loader_mt942"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
show_missing = true

[tool.interrogate]
fail-under = 100
ignore-init-module = true
ignore-magic = true
verbose = 1

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "camt053.*"
ignore_missing_imports = true
